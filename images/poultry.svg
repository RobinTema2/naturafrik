<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1205"/>
      <stop offset="100%" style="stop-color:#141C08"/>
    </linearGradient>
    <radialGradient id="chicken" cx="40%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#E8D060"/>
      <stop offset="100%" style="stop-color:#C0A030"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Ground -->
  <ellipse cx="300" cy="360" rx="280" ry="30" fill="#1A2A0A" opacity="0.5"/>
  <!-- Chicken body -->
  <ellipse cx="200" cy="280" rx="90" ry="70" fill="url(#chicken)"/>
  <!-- Wing -->
  <ellipse cx="180" cy="285" rx="60" ry="40" fill="#C8A828" opacity="0.7" transform="rotate(-15 180 285)"/>
  <!-- Neck -->
  <ellipse cx="200" cy="210" rx="25" ry="40" fill="#E8D060"/>
  <!-- Head -->
  <circle cx="200" cy="178" r="32" fill="#E8D060"/>
  <!-- Comb -->
  <path d="M192 148 Q200 132 208 148" fill="#D03030" stroke="#A02020" stroke-width="1"/>
  <ellipse cx="200" cy="147" rx="5" ry="8" fill="#D03030"/>
  <!-- Beak -->
  <path d="M218 178 L235 173 L218 183 Z" fill="#E8A020"/>
  <!-- Eye -->
  <circle cx="212" cy="172" r="5" fill="#1A0A00"/>
  <circle cx="213" cy="171" r="2" fill="white"/>
  <!-- Wattle -->
  <ellipse cx="215" cy="188" rx="6" ry="9" fill="#D03030"/>
  <!-- Tail feathers -->
  <path d="M108 265 Q80 230 90 205 Q110 235 130 265 Z" fill="#A08020"/>
  <path d="M100 278 Q68 250 75 225 Q98 252 118 278 Z" fill="#B89025"/>
  <!-- Legs -->
  <rect x="185" y="345" width="8" height="30" rx="4" fill="#E8A020"/>
  <rect x="208" y="345" width="8" height="30" rx="4" fill="#E8A020"/>
  <!-- Feet -->
  <path d="M185 375 L168 380 M185 375 L180 382 M185 375 L188 382" stroke="#E8A020" stroke-width="3" stroke-linecap="round"/>
  <path d="M215 375 L198 380 M215 375 L210 382 M215 375 L218 382" stroke="#E8A020" stroke-width="3" stroke-linecap="round"/>
  <!-- Second chicken (background) -->
  <ellipse cx="420" cy="295" rx="75" ry="58" fill="#C0A030" opacity="0.7"/>
  <circle cx="420" cy="228" r="26" fill="#C0A030" opacity="0.7"/>
  <path d="M435 228 L450 224 L435 232 Z" fill="#D09015" opacity="0.8"/>
  <path d="M412 200 Q420 187 428 200" fill="#C02020" opacity="0.7"/>
  <!-- Label -->
  <rect x="0" y="330" width="600" height="70" fill="#0A1205" opacity="0.85"/>
  <text x="300" y="362" font-family="serif" font-size="16" text-anchor="middle" fill="#C8A030" letter-spacing="4">VOLAILLE FERMIÈRE</text>
  <text x="300" y="383" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#808040" letter-spacing="2">ÉLEVAGE NATUREL · CAMEROUN</text>
</svg>
