  <!-- Furrow lines -->
  <path d="M0,310 Q150,300 300,310 Q450,320 600,310" fill="none" stroke="#4A3018" stroke-width="1.5" opacity="0.5"/>
  <path d="M0,340 Q150,330 300,340 Q450,350 600,340" fill="none" stroke="#4A3018" stroke-width="1.5" opacity="0.5"/>
