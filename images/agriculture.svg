  <text x="300" y="362" font-family="serif" font-size="16" text-anchor="middle" fill="#90C040" letter-spacing="4">AGRICULTURE</text>
  <text x="300" y="383" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#507025" letter-spacing="2">CÉRÉALES · TUBERCULES · ÉLEVAGE</text>
