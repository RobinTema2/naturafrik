    <rect x="323" y="268" width="14" height="22" rx="7" fill="#F0C030"/>

    <line x1="380" y1="395" x2="380" y2="255" stroke="#3A8020" stroke-width="3"/>
    <ellipse cx="380" cy="253" rx="12" ry="20" fill="#4A9828" opacity="0.8"/>
    <rect x="373" y="273" width="14" height="22" rx="7" fill="#E8B828"/>

