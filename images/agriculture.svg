<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A10"/>
      <stop offset="100%" style="stop-color:#2A5520"/>
    </linearGradient>
    <linearGradient id="land" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A2810"/>
      <stop offset="100%" style="stop-color:#2A1C08"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0A1205"/>
  <!-- Sky -->
  <rect width="600" height="220" fill="url(#sky)"/>
  <!-- Sun / glow -->
  <circle cx="300" cy="80" r="50" fill="#F0C030" opacity="0.15"/>
  <circle cx="300" cy="80" r="35" fill="#F0C030" opacity="0.2"/>
  <circle cx="300" cy="80" r="22" fill="#F0C040" opacity="0.35"/>
