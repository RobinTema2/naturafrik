<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0800"/>
      <stop offset="100%" style="stop-color:#1A1400"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A010"/>
      <stop offset="20%" style="stop-color:#F5D040"/>
      <stop offset="50%" style="stop-color:#FFE060"/>
      <stop offset="80%" style="stop-color:#F0C030"/>
      <stop offset="100%" style="stop-color:#C09010"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0B020"/>
      <stop offset="40%" style="stop-color:#C8960E"/>
      <stop offset="100%" style="stop-color:#8B6008"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A07808"/>
      <stop offset="100%" style="stop-color:#6B5005"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Shine dots background -->
  <circle cx="50" cy="80" r="2" fill="#F0C030" opacity="0.3"/>
  <circle cx="150" cy="40" r="1.5" fill="#F0C030" opacity="0.2"/>
  <circle cx="500" cy="60" r="2" fill="#F0C030" opacity="0.3"/>
  <circle cx="560" cy="150" r="1.5" fill="#F0C030" opacity="0.2"/>
  <circle cx="80" cy="350" r="2" fill="#F0C030" opacity="0.2"/>
  <circle cx="520" cy="340" r="1.5" fill="#F0C030" opacity="0.3"/>
  <!-- Gold bar 3D -->
  <!-- Top face -->
  <polygon points="140,140 460,140 490,110 170,110" fill="url(#goldTop)"/>
  <!-- Front face -->
  <polygon points="140,140 460,140 460,280 140,280" fill="url(#goldFront)"/>
  <!-- Right side face -->
  <polygon points="460,140 490,110 490,250 460,280" fill="url(#goldSide)"/>
  <!-- Embossed border top face -->
  <polygon points="155,133 445,133 472,118 182,118" fill="none" stroke="#FFE060" stroke-width="1.5" opacity="0.5"/>
  <!-- Embossed border front face -->
  <polygon points="155,148 445,148 445,272 155,272" fill="none" stroke="#E8C040" stroke-width="1.5" opacity="0.4"/>
  <!-- Text on gold bar -->
  <text x="300" y="190" font-family="serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#F5D040" letter-spacing="2">999.9</text>
  <text x="300" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#E0B020" letter-spacing="3">FINE GOLD</text>
  <rect x="210" y="222" width="180" height="1" fill="#E0B020" opacity="0.5"/>
  <text x="300" y="238" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#C09010" letter-spacing="2">CAMEROUN</text>
  <text x="300" y="255" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#C09010" letter-spacing="1">1 KG</text>
  <!-- Shine highlight -->
  <polygon points="180,150 220,145 220,275 180,280" fill="white" opacity="0.06"/>
  <!-- Label -->
  <rect x="0" y="330" width="600" height="70" fill="#0A0800" opacity="0.85"/>
  <text x="300" y="362" font-family="serif" font-size="16" text-anchor="middle" fill="#F0C030" letter-spacing="4">OR FIN 999.9</text>
  <text x="300" y="383" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#A08020" letter-spacing="2">MATIÈRE PREMIÈRE · CAMEROUN</text>
</svg>
