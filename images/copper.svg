<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080504"/>
      <stop offset="100%" style="stop-color:#120A06"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E87030"/>
      <stop offset="30%" style="stop-color:#D05C20"/>
      <stop offset="100%" style="stop-color:#8B3810"/>
    </linearGradient>
    <linearGradient id="copperTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C06020"/>
      <stop offset="30%" style="stop-color:#F08040"/>
      <stop offset="60%" style="stop-color:#E87030"/>
      <stop offset="100%" style="stop-color:#A04818"/>
    </linearGradient>
    <linearGradient id="copperSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#803010"/>
      <stop offset="100%" style="stop-color:#501A08"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Decorative particles -->
  <circle cx="60" cy="60" r="3" fill="#E87030" opacity="0.2"/>
  <circle cx="540" cy="80" r="2" fill="#E87030" opacity="0.2"/>
  <circle cx="100" cy="350" r="2.5" fill="#E87030" opacity="0.15"/>
  <circle cx="500" cy="340" r="2" fill="#E87030" opacity="0.2"/>
  <!-- Copper ingot 1 -->
  <polygon points="100,130 340,130 370,100 130,100" fill="url(#copperTop)"/>
  <polygon points="100,130 340,130 340,260 100,260" fill="url(#copper)"/>
  <polygon points="340,130 370,100 370,230 340,260" fill="url(#copperSide)"/>
  <!-- Emboss lines on ingot 1 -->
  <polygon points="115,122 325,122 352,110 142,110" fill="none" stroke="#F09050" stroke-width="1" opacity="0.4"/>
  <polygon points="115,140 325,140 325,250 115,250" fill="none" stroke="#E07030" stroke-width="1" opacity="0.3"/>
  <text x="220" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#F08040" letter-spacing="2" opacity="0.8">Cu 99.9%</text>
  <text x="220" y="210" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#D06020" letter-spacing="1" opacity="0.7">CUIVRE PUR</text>
  <!-- Copper ingot 2 (behind, right) -->
  <polygon points="240,160 480,160 510,130 270,130" fill="#C06020" opacity="0.7"/>
  <polygon points="240,160 480,160 480,290 240,290" fill="#B05018" opacity="0.6"/>
  <polygon points="480,160 510,130 510,260 480,290" fill="#703010" opacity="0.6"/>
  <!-- Copper wire coil accent -->
  <circle cx="490" cy="220" r="55" fill="none" stroke="#D06020" stroke-width="6" stroke-dasharray="8,4" opacity="0.5"/>
  <circle cx="490" cy="220" r="40" fill="none" stroke="#E07030" stroke-width="4" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="490" cy="220" r="25" fill="none" stroke="#D06020" stroke-width="3" stroke-dasharray="5,3" opacity="0.5"/>
  <!-- Label -->
  <rect x="0" y="330" width="600" height="70" fill="#080504" opacity="0.88"/>
  <text x="300" y="362" font-family="serif" font-size="16" text-anchor="middle" fill="#E07030" letter-spacing="4">CUIVRE</text>
  <text x="300" y="383" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#805020" letter-spacing="2">MATIÈRE PREMIÈRE · CAMEROUN</text>
</svg>
